<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membros | Área administrativa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/admin/css/admin.css?v=3.0.0">
</head>
<body class="admin-page admin-members-page">
    <div class="overlay" aria-hidden="true"></div>
    <button id="btnMenu" class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="adminSidebar"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
    <div class="dashboard admin-shell">
        <aside class="sidebar" id="adminSidebar">
            <a class="sidebar-brand" href="/dashboard" aria-label="Visão geral da igreja">
                <i class="sidebar-symbol fa-solid fa-church" aria-hidden="true"></i>
                <span class="sidebar-brand-title">Assembleia de Deus</span>
                <span class="sidebar-brand-subtitle">Gestão de membros</span>
            </a>
            <nav aria-label="Navegação administrativa">
                <ul class="menu">
                    <li ><a href="/dashboard"><i class="fa-solid fa-house" aria-hidden="true"></i><span>Visão geral</span></a></li>
                    <li class="active"><a href="/admin/membros" aria-current="page"><i class="fa-solid fa-users" aria-hidden="true"></i><span>Membros</span></a></li>
                    <li><a href="/scanner"><i class="fa-solid fa-qrcode" aria-hidden="true"></i><span>Leitor de QR Code</span></a></li>
                    <li><a href="/admin/presencas.html"><i class="fa-regular fa-calendar-check" aria-hidden="true"></i><span>Presenças</span></a></li>

            </nav>
            <div class="sidebar-footer">
                <div class="sidebar-user"><span class="admin-avatar" aria-hidden="true">AD</span><span>Administrador</span></div>

            </div>
        </aside>
        <main class="content admin-content" id="mainContent">

            <div class="page-content">

            <section class="pesquisa" aria-label="Pesquisar membros">
                <label class="sr-only" for="pesquisa">Pesquisar membro pelo nome</label>
                <input type="search" id="pesquisa" placeholder="Pesquisar membro pelo nome..." autocomplete="off">
                <button type="button" class="btn-pesquisar" aria-label="Pesquisar"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i></button>
            </section>
            <section class="lista-membros" id="lista-membros" aria-label="Membros cadastrados"></section>

    <script src="/js/security.js"></script>
    <script src="/admin/js/layout/menu.js?v=3.0.0"></script>
    <script src="/admin/js/membros/membros.js?v=3.0.0"></script>

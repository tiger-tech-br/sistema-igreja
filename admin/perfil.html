<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <!-- ========================= -->
    <!-- META -->
    <!-- ========================= -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>

        Meu Perfil

    </title>

    <!-- ========================= -->
    <!-- GOOGLE FONTS -->
    <!-- ========================= -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- ========================= -->
    <!-- FONT AWESOME -->
    <!-- ========================= -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- ========================= -->
    <!-- CSS GLOBAL -->
    <!-- ========================= -->

    <link
        rel="stylesheet"
        href="/css/global/global.css">

    <link
        rel="stylesheet"
        href="/css/global/variables.css">

    <link
        rel="stylesheet"
        href="/css/global/base.css">


    <link
        rel="stylesheet"
        href="/admin/css/pages/perfil.css?v=2.0.1">

</head>

<body>


    <!-- ========================= -->
    <!-- CONTEÚDO -->
    <!-- ========================= -->

        <main class="perfil-page">

            <section class="container">

                <div class="perfil-acoes">

                    <a
                        href="/"
                        class="btn-voltar-home"
                        id="linkVoltarPerfil">

                        <i class="fa-solid fa-arrow-left"></i>

                        <span>

                            Voltar

                        </span>

                    </a>

                </div>

                <div class="perfil-card">

                                <!-- ========================= -->
                <!-- CABEÇALHO DO PERFIL -->
                <!-- ========================= -->

                    <div class="perfil-titulo">

                        <h1 id="nome">

                            Carregando...

                        </h1>

                        <p
                            id="cargo"
                            class="perfil-cargo">

                        </p>

                    </div>

                </div>

                <hr>

                <!-- ========================= -->
                <!-- DADOS DO MEMBRO -->
                <!-- ========================= -->

                <div class="perfil-info">

                    <div class="info">

                        <i class="fa-solid fa-envelope"></i>

                        <div>

                            <strong>E-mail: </strong>

                            <span id="email"></span>

                        </div>

                    </div>

                    <div class="info">

                        <i class="fa-solid fa-phone"></i>

                        <div>

                            <strong>Telefone: </strong>

                            <span id="telefone"></span>

                        </div>

                    </div>

                            <div class="info">

                                    <i class="fa-solid fa-mobile-screen-button"></i>

                                    <div>

                                        <strong>Celular:</strong>

                                        <span id="celular"></span>

                                    </div>

                                </div>

                    </div>

                    <div class="info">

                        <i class="fa-solid fa-location-dot"></i>

                        <div>

                            <strong>Endereço: </strong>

                            <span id="endereco"></span>

                        </div>

                    </div>

                    <div class="info">

                        <i class="fa-solid fa-church"></i>

                        <div>

                            <strong>Ministério: </strong>

                            <span id="ministerio"></span>

                        </div>

                    </div>

                </div>

                <hr>

                            <!-- ========================= -->
                <!-- DADOS PESSOAIS -->
                <!-- ========================= -->

                <div class="perfil-info">

                    <div class="info">

                        <i class="fa-solid fa-venus-mars"></i>

                        <div>

                            <strong>Sexo: </strong>

                            <span id="sexo"></span>

                        </div>

                    </div>

                    <div class="info">

                        <i class="fa-solid fa-heart"></i>

                        <div>

                            <strong>Estado Civil: </strong>

                            <span id="estadoCivil"></span>

                        </div>

                    </div>

                    <div class="info">

                        <i class="fa-solid fa-calendar-days"></i>

                        <div>

                            <strong>Data de Nascimento: </strong>

                            <span id="nascimento"></span>

                        </div>

                    </div>

                    <div class="info">

                        <i class="fa-solid fa-id-card"></i>

                        <div>

                            <strong>Matrícula: </strong>

                            <span id="matricula"></span>

                        </div>

                    </div>

                    <div class="info">

                        <i class="fa-solid fa-calendar-check"></i>

                        <div>

                            <strong>Validade: </strong>

                            <span id="validade"></span>

                        </div>

                    </div>

                </div>

                <hr>

                <!-- ========================= -->
                <!-- QR CODE -->
                <!-- ========================= -->

                <section class="perfil-qrcode">

                    <h2>

                        Credencial Digital

                    </h2>

                    <p>

                        Apresente este QR Code quando solicitado.

                    </p>

                    <img

                        id="qrCode"

                        src=""

                        alt="QR Code da credencial do membro">

                </section>

                <div
                    class="perfil-excluir hidden"
                    id="areaExcluirCadastro">

                    <button
                        type="button"
                        class="btn-acao-perfil btn-editar-admin"
                        id="btnEditarAdministrativo">

                        <i class="fa-solid fa-pen-to-square"></i>

                        <span>

                            Editar cargo/ministério

                        </span>

                    </button>

                    <button
                        type="button"
                        class="btn-acao-perfil btn-excluir-cadastro"
                        id="btnExcluirCadastro">

                        <i class="fa-solid fa-trash"></i>

                        <span>

                            Excluir cadastro

                        </span>

                    </button>

                </div>

            </div>

        </section>

    </main>


    <!-- ========================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================= -->

    <script src="/admin/js/perfil/perfil.js?v=2.0.1"></script>

</body>

</html>

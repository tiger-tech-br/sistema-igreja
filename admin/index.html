<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Área administrativa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/admin/css/admin.css?v=3.1.0">
</head>
<body class="admin-login-page">
    <main class="login-container">
        <section class="login-card" aria-labelledby="tituloLogin">
            <a class="login-brand" href="/" aria-label="Visitar site da igreja"><img src="/images/assembleia-logo.png" alt="Logo da Assembléia de Deus" class="logo"><span class="brand-copy"><strong>Assembléia de Deus</strong><span>Lugar de Esperança</span></span></a>
            <p class="login-eyebrow">ÁREA ADMINISTRATIVA</p>
            <h1 id="tituloLogin">Bem-vindo de volta</h1>
            <p class="subtitulo login-description">Entre com seu e-mail e senha para acessar a gestão da igreja.</p>
            <form id="formLogin" autocomplete="on" novalidate aria-label="Formulário de login">
                <div class="campo"><label for="email">E-mail</label><div class="input"><i class="fa-solid fa-envelope" aria-hidden="true"></i><input type="email" id="email" placeholder="Digite seu e-mail" autocomplete="email" required></div></div>
                <div class="campo"><label for="senha">Senha</label><div class="input"><i class="fa-solid fa-lock" aria-hidden="true"></i><input type="password" id="senha" placeholder="Digite sua senha" autocomplete="current-password" required></div></div>
                <button type="submit" class="btn-login"><i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>Entrar</button>
                <a href="/esqueci-senha" id="esqueceuSenha" class="esqueceu-senha">Esqueceu sua senha?</a>
            </form>
            <a class="login-back" href="/"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i>Voltar ao site da igreja</a>
        </section>
    </main>
    <script src="/js/security.js"></script>
    <script src="/admin/js/login-admin/login-admin.js?v=2.0.0"></script>
</body>
</html>
